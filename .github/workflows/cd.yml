name: CD

on:
  push:
    branches: [main]
  # Refresh the GitHub data snapshot every 15 minutes (offset from the top of
  # the hour, when scheduled runs are most often delayed). During the session,
  # use "Run workflow" for an immediate refresh.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Cancel in-progress deployments for same branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write
  checks: read  # Required for wait-on-check-action to query CI status

jobs:
  # Wait for CI to complete before deploying
  # Scheduled and manual runs rebuild an already-tested commit, so only pushes wait for CI
  check-ci:
    name: Wait for CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.ref }}
          check-name: 'Type Check, Lint, Test & Build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  build:
    name: Build
    needs: check-ci
    if: ${{ !cancelled() && (needs.check-ci.result == 'success' || needs.check-ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: yarn install --immutable

      # Fails the run on any GitHub error, so Pages keeps serving the last good deploy
      - name: Fetch GitHub data snapshot
        run: yarn fetch-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
